name: Combined security workflow

on:
  workflow_dispatch: {}
  pull_request: {}
  push:
    branches:
      - main
      - master

permissions:
  contents: read
  security-events: write

jobs:
  gitguardian:
    name: GitGuardian scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: GitGuardian scan
        uses: GitGuardian/ggshield/actions/secret@v1.55.0
        env:
          GITHUB_PUSH_BEFORE_SHA: ${{ github.event.before }}
          GITHUB_PUSH_BASE_SHA: ${{ github.event.base }}
          GITHUB_PULL_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}

  semgrep:
    name: Semgrep scan
    runs-on: ubuntu-latest
    env:
      SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
    container:
      image: returntocorp/semgrep
    steps:
      - uses: actions/checkout@v3
      - run: semgrep ci

  snyk-sca:
    name: Snyk SCA report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: snyk/actions/setup@master
      - name: SCA scan (fail on critical issues)
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk test --severity-threshold=critical --sarif-file-output=snyk-sca.sarif --json-file-output=snyk-sca.json
      - name: Monitor in Snyk web app
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk monitor
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: snyk-sca.sarif
          category: snyk-sca
      - uses: actions/upload-artifact@v4
        with:
          name: sca-report
          path: snyk-sca.json

  zap:
    name: ZAP baseline scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Run ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: "https://testfire.net/"
          allow_issue_writing: false
          cmd_options: ""
          fail_action: true

  quality-gate:
    name: Quality gate
    needs: [gitguardian, semgrep, snyk-sca, zap]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require all security jobs to pass
        shell: bash
        env:
          GITGUARDIAN_RESULT: ${{ needs.gitguardian.result }}
          SEMGREP_RESULT: ${{ needs.semgrep.result }}
          SNYK_RESULT: ${{ needs.snyk-sca.result }}
          ZAP_RESULT: ${{ needs.zap.result }}
        run: |
          set -euo pipefail
          for result_name in GITGUARDIAN_RESULT SEMGREP_RESULT SNYK_RESULT ZAP_RESULT; do
            result="${!result_name}"
            echo "$result_name=$result"
            if [[ "$result" != "success" ]]; then
              echo "Quality gate failed: $result_name was $result."
              exit 1
            fi
          done
          echo "All required security jobs passed. Quality gate succeeded."
